[project]
name = "nowires"
version = "3.0.0"
description = "QGIS plugin for radio propagation analysis and terrain tools using ITM with Copernicus GLO-30 DEM"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Bortre Tenamo", email = "tedaks@gmail.com"},
]

[project.optional-dependencies]
dev = [
    "defusedxml>=0.7",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "numpy>=1.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: benchmark tests (deselect with '-m \"not benchmark\"')",
    "qgis_integration: requires a real QGIS runtime (deselect with '-m \"not qgis_integration\"')",
    "gdal_integration: requires numpy-compatible GDAL bindings (deselect with '-m \"not gdal_integration\"')",
    "slow: slow-running tests that require extra resources",

]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "itm/*",
    "benchmarks/*",
    "scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.bumpversion]
current_version = "3.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: bump version {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "metadata.txt"
search = "version={current_version}"
replace = "version={new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "metadata.txt"
search = "Version {current_version}"
replace = "Version {new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = "version {current_version}"
replace = "version {new_version}"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
ignore = ["E402"]