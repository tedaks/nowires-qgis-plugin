name: QGIS Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qgis-integration:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        qgis_version: ["4.0"]
      fail-fast: false

    container:
      image: qgis/qgis:${{ matrix.qgis_version }}
      env:
        QGIS_PREFIX_PATH: /usr
        QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install --break-system-packages -r requirements-ci.txt

      - name: Run QGIS integration tests with coverage
        run: pytest -m qgis_integration -v --tb=short --cov --cov-fail-under=0 --cov-report=term-missing

      - name: Run GDAL compatibility tests
        run: pytest tests/test_gdal_compat.py -v --tb=short --cov --cov-append --cov-report=

      - name: Run raster_io integration tests with combined coverage check
        run: pytest tests/test_raster_io_integration.py -v --tb=short --cov --cov-append --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage
          if-no-files-found: ignore
