name: QGIS Integration Tests

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Lint is owned by tests.yml and required via branch protection; no need
  # to duplicate it here.
  qgis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        qgis_version: ["4.0"]

    container:
      # Pinned to digest so upstream point releases of qgis/qgis:4.0
      # cannot silently change CI behavior. Bump intentionally when
      # validating a newer image.
      image: qgis/qgis:${{ matrix.qgis_version }}@sha256:6f33d932b56305a550d9e079d64daeabca71fcc97101bba1ca578c55c0e1439b
      env:
        QGIS_PREFIX_PATH: /usr
        QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create venv with system-site-packages
        # QGIS Python bindings live in the container's system site-packages
        # and cannot be pip-installed, so the venv inherits them. Pinned
        # versions go into the venv (which precedes system on sys.path) and
        # shadow the apt-shipped copies of pytest/numpy/defusedxml. Unlike
        # the previous --ignore-installed approach, pip check now sees both
        # layers and surfaces real conflicts instead of silently masking
        # them.
        run: |
          python3 -m venv --system-site-packages /opt/ci-venv
          echo "/opt/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: pip install -c constraints-ci.txt -r requirements-test.txt matplotlib

      - name: Verify dependency tree
        run: pip check

      # Coverage is informational only in integration (subset of suite);
      # the unit-test job in tests.yml enforces the project threshold.
      - name: Run QGIS integration tests with coverage
        run: pytest -m qgis_integration -v --tb=short --cov --cov-fail-under=0 --cov-report=

      - name: Run GDAL compatibility tests
        run: pytest tests/test_gdal_compat.py -v --tb=short --cov --cov-append --cov-fail-under=0 --cov-report=

      - name: Run raster_io integration tests
        run: pytest tests/test_raster_io_integration.py -v --tb=short --cov --cov-append --cov-fail-under=0 --cov-report=term-missing

      - name: Run GDAL integration tests (numpy-dependent WriteArray/ReadAsArray)
        run: pytest -m gdal_integration -v --tb=short --cov --cov-append --cov-fail-under=0 --cov-report=

      - name: Run coverage perf benchmark
        # Needs GDAL, which is bundled in the qgis/qgis container but not on
        # the benchmark workflow's ubuntu-latest runner. Stdout is informational.
        run: python3 benchmarks/coverage_runtime.py

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-integration-${{ matrix.qgis_version }}
          path: .coverage
          if-no-files-found: ignore
