name: QGIS Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qgis-integration:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        qgis_version: ["4.0"]
      fail-fast: false

    container:
      image: qgis/qgis:${{ matrix.qgis_version }}
      env:
        QGIS_PREFIX_PATH: /usr
        QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install --break-system-packages pytest pytest-cov numpy defusedxml hypothesis ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run all QGIS integration tests with coverage
        run: pytest -m qgis_integration -v --tb=short --cov=NoWires --cov-fail-under=0 --cov-report=term-missing

      - name: Run GDAL compatibility tests
        run: pytest tests/test_gdal_compat.py -v --tb=short

      - name: Run raster_io integration tests
        run: pytest tests/test_raster_io_integration.py -v --tb=short --cov=NoWires --cov-append --cov-fail-under=0 --cov-report=term-missing