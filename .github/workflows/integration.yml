name: QGIS Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qgis-integration:
    runs-on: ubuntu-latest

    container:
      image: qgis/qgis:4.0
      env:
        QGIS_PREFIX_PATH: /usr
        QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install --break-system-packages pytest numpy

      - name: Run QGIS integration tests
        run: pytest tests/test_qgis_integration.py -v --tb=short

      - name: Run Qt dialog tests
        run: pytest tests/test_pyqt_dialogs.py -v --tb=short

      - name: Run plugin lifecycle tests
        run: pytest tests/test_plugin_load.py -v --tb=short

      - name: Run provider registration tests
        run: pytest tests/test_provider_registration.py -v --tb=short

      - name: Run GDAL compatibility tests
        run: pytest tests/test_gdal_compat.py -v --tb=short

      - name: Run raster rendering smoke tests
        run: pytest tests/test_raster_rendering_smoke.py -v --tb=short