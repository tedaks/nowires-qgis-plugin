name: Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install test dependencies
        run: pip install -c constraints-ci.txt -r requirements-test.txt

      - name: Run benchmark smoke tests
        run: pytest -m benchmark --tb=short -s | tee benchmark-output.txt

      - name: Run p2p perf benchmark
        run: |
          # pytest -m benchmark only runs structural smoke tests; this script measures
          # real runtime. coverage_runtime.py needs GDAL and runs in integration.yml
          # where the qgis/qgis container provides it.
          {
            echo "=== benchmarks/p2p_runtime.py ==="
            python3 benchmarks/p2p_runtime.py
          } | tee -a benchmark-output.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-output-${{ github.run_id }}
          path: benchmark-output.txt
          if-no-files-found: ignore
