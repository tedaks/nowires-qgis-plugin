name: Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install test dependencies
        run: pip install -c constraints-ci.txt -r requirements-test.txt

      - name: Run benchmark smoke tests
        run: pytest -m benchmark --tb=short -s | tee benchmark-output.txt

      - name: Run p2p perf benchmark
        run: |
          # pytest -m benchmark only runs structural smoke tests; this script measures
          # real runtime. coverage_runtime.py needs GDAL and runs in integration.yml
          # where the qgis/qgis container provides it.
          {
            echo "=== benchmarks/p2p_runtime.py ==="
            python3 benchmarks/p2p_runtime.py
          } | tee -a benchmark-output.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: benchmark-output-${{ github.run_id }}
          path: benchmark-output.txt
          if-no-files-found: ignore
