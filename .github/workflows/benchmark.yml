name: Benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # required to download artifacts from prior workflow runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install test dependencies
        run: pip install -c constraints-ci.txt -r requirements-test.txt

      - name: Run benchmark smoke tests
        run: pytest -m benchmark --tb=short -s | tee benchmark-output.txt

      - name: Run p2p perf benchmark
        run: |
          # pytest -m benchmark only runs structural smoke tests; this script measures
          # real runtime. coverage_runtime.py needs GDAL and runs in integration.yml
          # where the qgis/qgis container provides it.
          {
            echo "=== benchmarks/p2p_runtime.py ==="
            python3 benchmarks/p2p_runtime.py
          } | tee -a benchmark-output.txt

      - name: Download latest main baseline
        # Best-effort: pulls benchmark-output.txt from the most recent
        # successful run of this workflow on main. Artifacts expire after
        # 90 days by default — comparison silently skips if unavailable.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          main_run_id=$(gh run list \
            --workflow benchmark.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' || true)
          if [ -z "$main_run_id" ] || [ "$main_run_id" = "null" ]; then
            echo "No successful main run found; skipping baseline download"
            exit 0
          fi
          echo "Downloading benchmark output from main run $main_run_id"
          gh run download "$main_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name benchmark-output \
            --dir baseline \
            || echo "Baseline artifact unavailable (possibly expired)"

      - name: Diff against main baseline (informational)
        # Prints a unified diff for human review on the PR check log.
        # Does not fail the job — runtime variance on shared runners makes
        # auto-failing too noisy without a regression threshold.
        if: github.event_name == 'pull_request'
        run: |
          if [ -f baseline/benchmark-output.txt ]; then
            echo "=== Diff vs latest successful main ==="
            diff -u baseline/benchmark-output.txt benchmark-output.txt || true
          else
            echo "No baseline available; skipping comparison"
          fi

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Stable name (no run_id suffix) so PR runs can download the
          # latest main artifact by name.
          name: benchmark-output
          path: benchmark-output.txt
          if-no-files-found: ignore
