name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.5.3). Must already exist."
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Gate the release on the full Tests suite (lint/audit/mypy/import-linter/
  # pytest) running against the exact tagged commit. Reusing tests.yml via
  # workflow_call avoids duplication and ensures a tag pushed to a broken
  # commit cannot ship.
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write       # required by actions/attest-build-provenance
      attestations: write   # required by actions/attest-build-provenance

    steps:
      - name: Resolve tag and version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF##refs/tags/}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: tag '$tag' does not match vX.Y.Z"; exit 1 ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify metadata.txt matches tag
        run: |
          meta_version=$(grep -oP '^version=\K.*' metadata.txt | tr -d '[:space:]')
          if [ "$meta_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: metadata.txt version ($meta_version) != tag ${{ steps.tag.outputs.version }}"
            exit 1
          fi
          echo "metadata.txt version matches tag: $meta_version"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.tag.outputs.version }}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "ERROR: CHANGELOG.md has no entries under ## [$version]"
            exit 1
          fi
          {
            echo "## NoWires v$version"
            echo
            echo "$notes"
          } > RELEASE_NOTES.md
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md

      - name: Build plugin zip
        id: build
        run: |
          version="${{ steps.tag.outputs.version }}"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/NoWires"

          # Explicit include list: only matching paths ship in the bundle.
          # New dev files/dirs are excluded by default and must be added here.
          # Directories shipped recursively:
          include_dirs=(itm algorithm batch comparison contour radio_coverage clutter p2p report)
          # Root-level files/patterns shipped (subdirectory matches are filtered out):
          include_root_files=(
            '*.py'
            CHANGELOG.md
            LICENSE
            NOTICE.md
            README.md
            Technical_Documentation.md
            USERS-GUIDE.md
            logo.png
            logo.svg
            metadata.txt
          )
          manifest="$RUNNER_TEMP/manifest.txt"
          : > "$manifest"
          for dir in "${include_dirs[@]}"; do
            git ls-files -z -- "$dir" | tr '\0' '\n' >> "$manifest"
          done
          for pat in "${include_root_files[@]}"; do
            git ls-files -z -- "$pat" | tr '\0' '\n' | grep -vE '/' >> "$manifest"
          done
          sort -u -o "$manifest" "$manifest"

          tar -cf - --files-from="$RUNNER_TEMP/manifest.txt" | tar -xf - -C "$stage/NoWires"

          zip_name="NoWires-$version.zip"
          (cd "$stage" && zip -rq "$GITHUB_WORKSPACE/$zip_name" NoWires)

          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "--- zip contents (first 40) ---"
          unzip -l "$zip_name" | head -40
          echo "--- size ---"
          ls -lh "$zip_name"

      - name: Verify zip contains required plugin files
        run: |
          verify_dir="$RUNNER_TEMP/verify"
          rm -rf "$verify_dir" && mkdir -p "$verify_dir"
          unzip -q "${{ steps.build.outputs.zip }}" -d "$verify_dir"

          required=(
            NoWires/__init__.py
            NoWires/metadata.txt
            NoWires/logo.png
            NoWires/nowires.py
            NoWires/provider.py
            NoWires/itm
            NoWires/algorithm/p2p.py
            NoWires/batch/outputs.py
            NoWires/comparison/panel.py
            NoWires/contour/pipeline.py
            NoWires/radio_coverage/engine.py
            NoWires/clutter/__init__.py
            NoWires/p2p/compute.py
            NoWires/report/export.py
          )
          missing=0
          for path in "${required[@]}"; do
            if [ ! -e "$verify_dir/$path" ]; then
              echo "ERROR: missing from zip: $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          zip_version=$(grep -oP '^version=\K.*' "$verify_dir/NoWires/metadata.txt" | tr -d '[:space:]')
          if [ "$zip_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: zipped metadata.txt version ($zip_version) != tag ${{ steps.tag.outputs.version }}"
            exit 1
          fi
          echo "Zip smoke check OK (metadata.txt version: $zip_version)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: ${{ steps.build.outputs.zip }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NoWires v${{ steps.tag.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "${{ steps.build.outputs.zip }}"
