name: Version and Changelog Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine whether to enforce
        id: gate
        if: github.event_name == 'pull_request'
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$PR_ACTOR" = "dependabot[bot]" ]; then
            echo "Skipping: PR opened by dependabot[bot]"
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -q '"no-version-bump"'; then
            echo "Skipping: 'no-version-bump' label present"
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -q '"release"'; then
            echo "Skipping unreleased-entries check: 'release' label present"
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if [ -z "$changed" ]; then
            echo "No changed files detected; enforcing by default"
            echo "enforce=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CHANGELOG.md|metadata.txt)
                docs_only=false; break ;;
              docs/*|*.md)
                ;;
              *)
                docs_only=false; break ;;
            esac
          done <<< "$changed"

          if [ "$docs_only" = "true" ]; then
            echo "Skipping: docs-only diff"
            echo "Changed files:"
            echo "$changed" | sed 's/^/  /'
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enforce=true" >> "$GITHUB_OUTPUT"

      - name: Check metadata version differs from base
        if: github.event_name == 'pull_request' && steps.gate.outputs.enforce == 'true'
        run: |
          # tr strip protects against CRLF / trailing whitespace differences.
          pr_version=$(grep -oP '^version=\K.*' metadata.txt | tr -d '[:space:]')
          echo "PR version: $pr_version"

          git fetch origin "${{ github.base_ref }}"
          base_version=$(git show "origin/${{ github.base_ref }}:metadata.txt" | grep -oP '^version=\K.*' | tr -d '[:space:]')
          echo "Base version: $base_version"

          if [ "$pr_version" = "$base_version" ]; then
            echo "ERROR: metadata.txt version ($pr_version) has not been bumped from base ($base_version)"
            exit 1
          fi
          pr_parts=$(echo "$pr_version" | tr '.' ' ')
          base_parts=$(echo "$base_version" | tr '.' ' ')
          IFS=' ' read -ra pr_arr <<< "$pr_parts"
          IFS=' ' read -ra base_arr <<< "$base_parts"
          downgraded=false
          for i in 0 1 2; do
            if [ "${pr_arr[i]}" -lt "${base_arr[i]}" ]; then
              downgraded=true; break
            elif [ "${pr_arr[i]}" -gt "${base_arr[i]}" ]; then
              break
            fi
          done
          if [ "$downgraded" = "true" ]; then
            echo "ERROR: metadata.txt version ($pr_version) is a downgrade from base ($base_version)"
            exit 1
          fi
          echo "Version bump OK: $base_version -> $pr_version"

      - name: Check changelog has unreleased entries
        if: github.event_name == 'pull_request' && steps.gate.outputs.enforce == 'true'
        run: |
          unreleased_start=$(grep -n '## \[Unreleased\]' CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$unreleased_start" ]; then
            echo "ERROR: CHANGELOG.md missing [Unreleased] section"
            exit 1
          fi

          total_lines=$(wc -l < CHANGELOG.md)
          next_header=$(awk -v start="$unreleased_start" 'NR > start && /^## \[/ {print NR; exit}' CHANGELOG.md)
          if [ -z "$next_header" ]; then
            # [Unreleased] is the last section — include the final line.
            end="$total_lines"
          else
            end=$((next_header - 1))
          fi

          start=$((unreleased_start + 1))
          entries=$(sed -n "${start},${end}p" CHANGELOG.md | grep -c '^[[:space:]]*- ' || true)

          if [ "$entries" -eq 0 ]; then
            echo "ERROR: CHANGELOG.md [Unreleased] section has no entries"
            exit 1
          fi
          echo "Changelog OK: $entries entries under [Unreleased]"

      - name: Check all version-bearing locations align
        run: |
          # Always runs (no gate) — catches drift even on Dependabot/docs PRs.
          # All six locations must agree. itm/__init__.py __version__ is the
          # bundled ITM library version and is intentionally independent.
          meta_version=$(grep -oP '^version=\K.*' metadata.txt | tr -d '[:space:]')
          meta_top_block=$(grep -oP '^\s*Version \K[0-9]+\.[0-9]+\.[0-9]+' metadata.txt | head -1)
          changelog_top=$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md | head -1)
          pyproject_version=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml | head -1)
          pyproject_bumpversion=$(grep -oP '^current_version = "\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml | head -1)
          readme_version=$(grep -oP 'plugin source for \*\*NoWires\*\* version \K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1)

          echo "metadata.txt version=:             $meta_version"
          echo "metadata.txt embedded changelog:   $meta_top_block"
          echo "CHANGELOG.md top release:          $changelog_top"
          echo "pyproject.toml [project].version:  $pyproject_version"
          echo "pyproject.toml bumpversion:        $pyproject_bumpversion"
          echo "README.md intro line:              $readme_version"

          fail=0
          check() {
            local name="$1" got="$2" expected="$3"
            if [ -z "$got" ]; then
              echo "ERROR: $name — could not parse a version (regex matched nothing)"
              fail=1
            elif [ "$got" != "$expected" ]; then
              echo "ERROR: $name ($got) does not match metadata.txt version ($expected)"
              fail=1
            fi
          }
          check "metadata.txt embedded changelog top" "$meta_top_block" "$meta_version"
          check "CHANGELOG.md top release header"     "$changelog_top"  "$meta_version"
          check "pyproject.toml [project].version"    "$pyproject_version" "$meta_version"
          check "pyproject.toml bumpversion"          "$pyproject_bumpversion" "$meta_version"
          check "README.md intro line"                "$readme_version" "$meta_version"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Version alignment OK across all locations: $meta_version"
