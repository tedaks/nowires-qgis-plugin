name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: pip install --break-system-packages ruff

      - name: Run ruff check
        run: ruff check .

      - name: Verify no source file exceeds 300 lines
        run: |
          violating=$(find . -name '*.py' ! -path '*/tests/*' ! -path '*/itm/*' ! -path '*/__pycache__/*' -exec wc -l {} + | awk '/total$/ {next} $1 > 300 {print}')
          if [ -n "$violating" ]; then
            echo "ERROR: The following source files exceed 300 lines:"
            echo "$violating"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and pip-audit
        run: pip install --break-system-packages pip-audit numpy hypothesis defusedxml pytest

      - name: Audit dependencies
        run: pip-audit

  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mypy
        run: pip install --break-system-packages mypy numpy

      - name: Run mypy
        run: mypy . --config-file mypy.ini

  pytest:
    runs-on: ubuntu-latest
    needs: [lint, mypy]
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: pip install --break-system-packages pytest pytest-cov hypothesis numpy defusedxml

      - name: Run unit and contract tests with coverage
        run: pytest -q -m "not benchmark and not qgis_integration" --cov=NoWires --cov-fail-under=61 --cov-report=term-missing