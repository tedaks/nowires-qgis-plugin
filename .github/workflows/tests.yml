name: Tests

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install lint dependencies
        run: pip install -c constraints-ci.txt -r requirements-lint.txt

      - name: Run ruff check
        run: ruff check .

      - name: Verify no source file exceeds 300 lines
        run: |
          violating=$(find . -name '*.py' ! -path '*/tests/*' ! -path '*/itm/*' ! -path '*/benchmarks/*' ! -path '*/__pycache__/*' -exec wc -l {} + | awk '/total$/ {next} $1 > 300 {print}')
          if [ -n "$violating" ]; then
            echo "ERROR: The following source files exceed 300 lines:"
            echo "$violating"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install pip-audit
        run: pip install -c constraints-ci.txt pip-audit

      - name: Audit pinned dependencies
        run: pip-audit --requirement constraints-ci.txt

      - name: Generate full dependency tree
        run: pip install -c constraints-ci.txt -r requirements-test.txt

      - name: Audit full dependency tree
        run: pip-audit

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install type-check dependencies
        run: pip install -c constraints-ci.txt -r requirements-typecheck.txt

      - name: Run mypy
        run: mypy . --config-file mypy.ini

  import-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install import-linter
        run: pip install -c constraints-ci.txt import-linter

      - name: Make NoWires importable
        run: |
          workdir="$(dirname "$GITHUB_WORKSPACE")/nowires-pkg"
          mkdir -p "$workdir"
          ln -sfn "$GITHUB_WORKSPACE" "$workdir/NoWires"
          echo "PYTHONPATH=$workdir" >> "$GITHUB_ENV"

      - name: Run architecture rules
        working-directory: ${{ github.workspace }}
        run: lint-imports

  pytest:
    # Runs in parallel with lint/audit/mypy/import-linter. Each is enforced
    # independently via branch protection; coupling them serializes CI for
    # no signal benefit, and a freshly-disclosed CVE in audit shouldn't gate
    # test results.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install test dependencies
        run: pip install -c constraints-ci.txt -r requirements-test.txt

      - name: Run main test suite (coverage collection only)
        run: pytest -q -m "not benchmark and not qgis_integration and not gdal_integration" --ignore=tests/test_coverage_pool_extended.py --ignore=tests/test_plugin_load.py --cov --cov-report=

      - name: Run isolation-sensitive tests with combined coverage check
        run: pytest -q tests/test_coverage_pool_extended.py tests/test_plugin_load.py --cov --cov-append --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore
