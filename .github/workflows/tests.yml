name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install lint dependencies
        run: pip install -c constraints-ci.txt -r requirements-lint.txt

      - name: Run ruff check
        run: ruff check .

      - name: Verify no source file exceeds 300 lines
        run: |
          violating=$(find . -name '*.py' ! -path '*/tests/*' ! -path '*/itm/*' ! -path '*/__pycache__/*' -exec wc -l {} + | awk '/total$/ {next} $1 > 300 {print}')
          if [ -n "$violating" ]; then
            echo "ERROR: The following source files exceed 300 lines:"
            echo "$violating"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install pip-audit
        run: pip install -c constraints-ci.txt pip-audit

      - name: Audit pinned dependencies
        run: pip-audit --requirement constraints-ci.txt

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install type-check dependencies
        run: pip install -c constraints-ci.txt -r requirements-typecheck.txt

      - name: Run mypy
        run: mypy . --config-file mypy.ini

  pytest:
    runs-on: ubuntu-latest
    needs: [lint, audit, mypy]
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install test dependencies
        run: pip install -c constraints-ci.txt -r requirements-test.txt

      - name: Run main test suite (coverage collection only)
        run: pytest -q -m "not benchmark and not qgis_integration" --ignore=tests/test_coverage_pool_extended.py --ignore=tests/test_plugin_load.py --cov --cov-fail-under=0 --cov-report=

      - name: Run isolation-sensitive tests with combined coverage check
        run: pytest -q tests/test_coverage_pool_extended.py tests/test_plugin_load.py --cov --cov-append --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore
